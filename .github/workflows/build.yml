name: Build wcvoicekeep

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macos-14 于 2026-11 被 GitHub 下线（报错 "configuration
    # 'macos-14-arm64-us-default' is not supported"），改用现役 macos-15 镜像。
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Build
        run: |
          chmod 755 layout/DEBIAN/postinst
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: wcvoicekeep-rootless
          path: packages/*.deb

      - name: Collect dylib for TrollFools
        run: |
          mkdir -p out
          find . -name "WCVoiceKeep.dylib" -exec cp {} out/ \;
          ls -l out

      - name: Upload dylib (TrollFools inject)
        uses: actions/upload-artifact@v4
        with:
          name: WCVoiceKeep-dylib
          path: out/WCVoiceKeep.dylib
