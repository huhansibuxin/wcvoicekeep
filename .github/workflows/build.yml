name: Build wcvoicekeep

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# 按 run_id 分组，避免僵尸 run 互相挤掉（wctweak 踩过的坑）
concurrency:
  group: build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.variant }}-${{ matrix.flavor }})
    # 老板要求：改用 macOS 英特尔（x86_64）机器 —— macos-15/14 都是 Apple Silicon，
    # 夜间排队严重、机器池小不够用；macos-13 是 Intel 池，可用机器更多。
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        # 老板设备 = roothide 隐根，只编 roothide
        variant: [roothide]
        # 每次出两份（照 wctweak 流程）：
        #   log  = 带日志（daemon/SB 全量日志落 /var/mobile/*.log），排障用
        #   pure = 纯净版（WCVK_NO_LOG=1，所有日志埋点编译期剥离），日常用
        # 注意：拉起记录是功能不是日志，两个版本都写（受设置里的记录开关控制）
        flavor: [log, pure]

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Checkout
        uses: actions/checkout@v4

      # roothide 必须用 roothide 官方 fork 的 theos（普通 theos 不认 roothide scheme）
      - name: Setup Theos (roothide)
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Build
        env:
          # pure 变体：编译期剥掉全部日志（Makefile 里 -DWCVK_NO_LOG=1）
          WCVK_NO_LOG: ${{ matrix.flavor == 'pure' && '1' || '0' }}
        run: |
          set -o pipefail
          chmod 755 layout/DEBIAN/postinst
          echo "flavor=${{ matrix.flavor }}  WCVK_NO_LOG=$WCVK_NO_LOG"
          make package 2>&1 | tee build.log

      - name: Rename deb with flavor
        run: |
          set -o pipefail
          {
            DEB=$(find packages -name '*.deb' -print -quit)
            if [ -z "$DEB" ]; then echo "ERROR: no deb produced"; find . -name '*.deb' | head; exit 1; fi
            OUT="packages/wcvoicekeep-${{ matrix.variant }}-${{ matrix.flavor }}.deb"
            rm -f "$OUT"
            dpkg-deb -b .theos/_ "$OUT"
            echo "=== deb control ==="; dpkg-deb -f "$OUT" | head -10
            echo "=== contents ==="; dpkg-deb -c "$OUT" | grep -E "PreferenceBundles|PreferenceLoader|usr/bin|TweakInject|LaunchDaemons" | head -20
          } 2>&1 | tee -a build.log

      - name: Collect injected dylib
        if: success()
        run: |
          DYLIB=$(find .theos -name 'wcprewarmfix.dylib' -type f -print -quit)
          echo "dylib=$DYLIB"
          mkdir -p packages/out
          if [ -z "$DYLIB" ]; then echo "ERROR: wcprewarmfix.dylib not produced"; exit 1; fi
          cp "$DYLIB" packages/out/wcprewarmfix.dylib
          ls -l packages/out

      - name: Upload injected dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcprewarmfix-dylib-${{ matrix.variant }}-${{ matrix.flavor }}
          path: packages/out/wcprewarmfix.dylib

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}-${{ matrix.flavor }}
          path: build.log

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcvoicekeep-${{ matrix.variant }}-${{ matrix.flavor }}
          path: packages/wcvoicekeep-${{ matrix.variant }}-${{ matrix.flavor }}.deb
